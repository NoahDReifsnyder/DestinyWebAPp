[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "destiny-web-app"
version = "0.1.0"
description = "A clean, incrementally verified Destiny web application."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
destiny_web_app = [
    "py.typed",
    "templates/*.html",
    "static/*.css",
    "static/*.js",
]
