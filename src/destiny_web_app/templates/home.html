<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$app_name</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #10151d;
        color: #f4f7fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(36rem, calc(100% - 3rem));
        padding: 2.5rem;
        border: 1px solid #334155;
        border-radius: 1rem;
        background: #18212d;
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 30%);
      }

      h1 {
        margin-top: 0;
        letter-spacing: 0.02em;
      }

      .status {
        display: inline-block;
        padding: 0.25rem 0.65rem;
        border-radius: 999px;
        background: #163d2c;
        color: #86efac;
        text-transform: uppercase;
        font-size: 0.75rem;
        font-weight: 700;
      }

      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.5rem 1rem;
        margin-bottom: 0;
      }

      dt {
        color: #94a3b8;
      }

      dd {
        margin: 0;
      }

      .auth-card {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #334155;
      }

      .auth-card h2 {
        margin-top: 0;
      }

      .username {
        font-size: 1.35rem;
        font-weight: 700;
      }

      .button,
      button {
        display: inline-block;
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      .button:hover,
      button:hover {
        background: #1d4ed8;
      }

      .button.danger,
      button.danger {
        background: #b4232f;
      }

      .button.danger:hover,
      button.danger:hover {
        background: #8f1d27;
      }

      .session-status {
        margin-bottom: 0;
        text-align: right;
        font-size: 0.75rem;
      }

      .session-status a {
        color: #94a3b8;
      }

      .warning {
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="status">$status</span>
      <h1>$app_name</h1>
      <p>$message</p>
      <p>This page is being rendered with data supplied by the Python application.</p>
      <dl>
        <dt>Version</dt>
        <dd>$version</dd>
        <dt>Environment</dt>
        <dd>$environment</dd>
      </dl>
      $auth_panel
    </main>
  </body>
</html>
